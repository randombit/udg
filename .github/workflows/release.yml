name: Release

on:
  push:
    tags: ["udg-*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # The tag is a claim about the version; make sure the tree agrees.
  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag must be udg-X.Y.Z and match the crate version
        run: |
          tag="${GITHUB_REF_NAME#udg-}"
          echo "$tag" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "tag $GITHUB_REF_NAME is not udg-X.Y.Z" >&2; exit 1; }
          version="$(cargo metadata --no-deps --format-version 1 |
            jq -r '.packages[] | select(.name == "udg") | .version')"
          if [ "$tag" != "$version" ]; then
            echo "tag udg-$tag does not match crate version $version" >&2
            exit 1
          fi

  build:
    needs: version-check
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # dlopen-libclang: the binary searches for libclang at runtime
      # (LIBCLANG_PATH overrides), so nothing links against the build
      # host's soname and no libclang is needed to build.
      - name: Build
        run: cargo build --release --features dlopen-libclang

      - name: Package
        run: |
          version="${GITHUB_REF_NAME#udg-}"
          name="udg-${version}-${{ matrix.target }}"
          mkdir "$name"
          cp target/release/udg README.md LICENSE CHANGELOG.md "$name"/
          cp -r themes "$name/themes"
          cp -r docs "$name/docs"
          tar czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            udg-*.tar.gz
            udg-*.tar.gz.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      # Release notes are the tagged version's section of CHANGELOG.md.
      - name: Extract release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#udg-}"
          awk -v v="$version" '
            /^## / { on = ($0 ~ ("udg " v "$")); next }
            on { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "no CHANGELOG.md section for udg $version" >&2; exit 1
          fi
          cat notes.md
      - name: Create GitHub release with artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            udg-*.tar.gz udg-*.tar.gz.sha256
