[package]
name = "udg"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.96"

description = "Documentation generator and linter for C++/C/Python libraries"
repository = "https://github.com/randombit/udg"
keywords = ["documentation", "doxygen", "sphinx", "cpp", "python"]
categories = ["command-line-utilities", "development-tools"]

exclude = [".github"]

[dependencies]
anyhow = "1"
clang = { version = "2", features = ["clang_10_0"] }
clap = { version = "4", features = ["derive"] }
comrak = "0.55"
glob = "0.3"
minijinja = "2"
rayon = "1.12"
regex = "1"
ruff_python_ast = "0.0.14"
ruff_python_parser = "0.0.14"
ruff_text_size = "0.0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
toml = "1.1"

[package.metadata.docs.rs]
# clang-sys links libclang at build time without this; the docs.rs
# builder has no libclang.
features = ["dlopen-libclang"]

[features]
# Portable-binary mode for releases: load libclang with dlopen at startup
# instead of linking at build time (LIBCLANG_PATH overrides the search),
# so release binaries don't depend on the build host's soname.
dlopen-libclang = ["clang/runtime"]
